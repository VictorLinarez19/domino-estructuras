<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominó - Estructuras Discretas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>Dominó - Estructuras Discretas</h1>
            <div class="score-display">
                <div class="team-score">
                    <h3>Equipo A</h3>
                    <span id="score-team-a">0</span>
                </div>
                <div class="team-score">
                    <h3>Equipo B</h3>
                    <span id="score-team-b">0</span>
                </div>
            </div>
        </header>

        <div class="controls-top">
            <button id="start-game">Iniciar Partida</button>
            <button id="draw-tile">Robar Ficha</button>
            <button id="pass-turn">Pasar Turno</button>
            <button id="end-hand">Terminar Mano</button>
            <button id="reset-game">Reiniciar Juego</button>
        </div>

        <div class="game-area">
            <div class="board-container">
                <div id="game-board" class="game-board"></div>
            </div>

            <div class="players-area">
                <div class="player-section">
                    <h3>Jugador 1 (Equipo A)</h3>
                    <div id="player1-tiles" class="player-tiles"></div>
                    <div id="player1-info" class="player-info">Turno actual</div>
                </div>

                <div class="player-section">
                    <h3>Jugador 2 (Equipo B)</h3>
                    <div id="player2-tiles" class="player-tiles"></div>
                    <div id="player2-info" class="player-info"></div>
                </div>

                <div class="player-section">
                    <h3>Jugador 3 (Equipo A)</h3>
                    <div id="player3-tiles" class="player-tiles"></div>
                    <div id="player3-info" class="player-info"></div>
                </div>

                <div class="player-section">
                    <h3>Jugador 4 (Equipo B)</h3>
                    <div id="player4-tiles" class="player-tiles"></div>
                    <div id="player4-info" class="player-info"></div>
                </div>
            </div>
        </div>

        <div id="question-modal" class="modal">
            <div class="modal-content">
                <h2>¡Pregunta!</h2>
                <p id="question-text">¿Cuál es la capital de Francia?</p>
                <div class="answers">
                    <button class="answer-btn" data-correct="true">París</button>
                    <button class="answer-btn">Londres</button>
                    <button class="answer-btn">Madrid</button>
                    <button class="answer-btn">Roma</button>
                </div>
            </div>
        </div>

        <div id="turn-modal" class="modal">
            <div class="modal-content turn-modal-content">
                <h2>¡Tu turno!</h2>
                <div id="turn-player-info" class="turn-player-info">
                    <div class="player-avatar">
                        <span id="turn-player-number">1</span>
                    </div>
                    <div class="player-details">
                        <h3 id="turn-player-name">Jugador 1</h3>
                        <p id="turn-player-team">Equipo A</p>
                    </div>
                </div>
                <button id="continue-turn-btn" class="continue-btn">Continuar</button>
            </div>
        </div>

        <div id="game-log" class="game-log">
            <h3>Registro del Juego</h3>
            <div id="log-content"></div>
        </div>
    </div>

    <!-- Elemento de audio para el sonido de colocar ficha -->
    <audio id="put-piece-sound" preload="auto">
        <source src="recursos/PutPiece.mp3" type="audio/mpeg">
    </audio>

    <script src="game.js"></script>

    <!-- Script de debug para verificar funcionamiento -->
    <script>
        // Verificar que el DOM esté cargado correctamente
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM cargado correctamente');
            console.log('Elementos encontrados:');
            console.log('- game-board:', document.getElementById('game-board'));
            console.log('- player1-tiles:', document.getElementById('player1-tiles'));
            console.log('- player2-tiles:', document.getElementById('player2-tiles'));
            console.log('- start-game:', document.getElementById('start-game'));
            console.log('- question-modal:', document.getElementById('question-modal'));
            console.log('- turn-modal:', document.getElementById('turn-modal'));

            // Verificar soporte de drag and drop
            const testDiv = document.createElement('div');
            const hasDragSupport = 'draggable' in testDiv;
            console.log('Soporte de drag and drop:', hasDragSupport);

            if (!hasDragSupport) {
                console.warn('El navegador no soporta drag and drop nativo');
            }
        });

        // Función de debug para verificar estado del juego
        window.debugGame = function() {
            if (typeof game !== 'undefined') {
                console.log('Estado del juego:', {
                    currentPlayerIndex: game.currentPlayerIndex,
                    gameStarted: game.gameStarted,
                    boardLength: game.board.length,
                    players: game.players.map(p => ({
                        name: p.name,
                        team: p.team,
                        tileCount: p.tiles.length
                    })),
                    scores: game.scores,
                    boardEnds: game.boardEnds
                });
            } else {
                console.log('El juego no está inicializado');
            }
        };

        // Función de prueba para verificar el sistema de puntuación
        window.testScoring = function() {
            if (typeof game !== 'undefined') {
                console.log('🧪 Probando sistema de puntuación...');

                // Simular añadir puntos
                console.log('Añadiendo 10 puntos al equipo A...');
                game.addPoints('A', 10);

                console.log('Añadiendo 15 puntos al equipo B...');
                game.addPoints('B', 15);

                console.log('Añadiendo 5 puntos al equipo A...');
                game.addPoints('A', 5);

                console.log('Puntuación final:', game.scores);
            } else {
                console.log('El juego no está inicializado');
            }
        };
    </script>
</body>
</html>
